spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog.xml
  profiles:
    active: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  photos:
    max-per-product: 10

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true
# Общие настройки для всех профилей
logging:
  level:
    root: INFO

storage:
  service:
    url: http://localhost:9090

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic



